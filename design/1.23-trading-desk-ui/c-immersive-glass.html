<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样板 C · 沉浸全屏 + 悬浮玻璃（Immersive HUD）</title>
<style>
/* ============================================================
   样板 C · 设计语言 =「沉浸全屏 + 悬浮玻璃 / Immersive HUD」
   一句话：图表铺满整屏，控制项变成"浮在图上的一层玻璃"，不动就不挡视线。
   特征：① 零常驻行 —— L0 = 图表 100% 高度（唯一真正的全屏方案）
        ② 控制分成 4 处浮层：左上标的条 / 左侧画线工具条 / 底部中央周期胶囊 /
           右上圆形按钮组（点开右侧玻璃抽屉放低频配置）
        ③ 鼠标静止 3 秒自动淡出（可 📌 钉住）；抽屉与浮层都不占布局
   ============================================================ */
:root{
  --glass:rgba(18,26,38,.62); --glass2:rgba(30,41,56,.72); --stroke:rgba(255,255,255,.14);
  --ink:#EAF1F8; --ink2:#B9C7D6; --muted:#8B9BAD; --faint:#61707F;
  --cyan:#38E1C6; --cyan-dim:#128C7C; --amber:#FFC562; --up:#FF5D6C; --down:#3ED598;
  --blur:blur(16px) saturate(1.25);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 22% -10%,#16263A 0%,#0B1220 46%,#080D16 100%);
     color:var(--ink);overflow:hidden;font:13px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.num{font-family:Consolas,"Cascadia Mono",monospace;font-variant-numeric:tabular-nums}

/* ---------- 图表（铺满整屏 = L0） ---------- */
.stage{position:fixed;inset:0;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:12px;padding:14px 20px 2px;flex:0 0 auto}
.ctitle{font-size:17px;font-weight:800;letter-spacing:.2px}
.csub{font-size:11.8px;color:var(--muted)}
.panes{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;padding:6px 20px 0}
.pane{position:relative}
.pane.main{flex:1 1 auto;min-height:0}
.pane.vol{height:92px;flex:0 0 auto}
.pane.macd{height:104px;flex:0 0 auto}
.pane svg{width:100%;height:100%;display:block}
.plabel{position:absolute;left:4px;top:2px;font-size:10.5px;color:var(--faint);letter-spacing:.5px}
.xaxis{display:flex;justify-content:space-between;padding:4px 22px 8px;font-size:11px;color:var(--faint);flex:0 0 auto}

/* ---------- 玻璃通用 ---------- */
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;
       backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
       box-shadow:0 18px 48px rgba(2,8,16,.5)}
.hud{position:absolute;transition:opacity .4s ease, transform .4s ease;z-index:6}
body.idle .hud{opacity:0;transform:translateY(4px);pointer-events:none}
body.pinned .hud{opacity:1;transform:none;pointer-events:auto}

/* ---------- 左上：标的浮条（L1 操作轴，浮着） ---------- */
.topsym{left:20px;top:10px;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-radius:999px}
.topsym .q{background:rgba(255,255,255,.08);border:1px solid var(--stroke);border-radius:999px;
           padding:5px 12px;font-size:12.5px;color:var(--ink2);width:150px;outline:none}
.topsym .q::placeholder{color:var(--faint)}
.topsym .q:focus{border-color:var(--cyan-dim);color:var(--ink)}
.topsym .rbtn{background:rgba(255,255,255,.08);border:1px solid var(--stroke);border-radius:999px;
              padding:5px 11px;font-size:12.2px;color:var(--ink2)}
.topsym .rbtn:hover{background:rgba(255,255,255,.16);color:var(--ink)}
.topsym .live{display:flex;align-items:center;gap:6px;font-size:12.2px;color:var(--muted)}
.topsym .live i{width:7px;height:7px;border-radius:50%;background:var(--down);box-shadow:0 0 0 4px rgba(62,213,152,.16)}

/* ---------- 左侧：画线工具条（浮着，TradingView 式） ---------- */
.toolrail{left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:14px}
.toolrail button{width:34px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.toolrail button:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.toolrail button.on{background:rgba(56,225,198,.16);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(56,225,198,.32)}
.toolrail .div{height:1px;background:var(--stroke);margin:4px 2px}

/* ---------- 底部中央：周期 / 叠加（L2 摘要，胶囊） ---------- */
.dock{left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:999px}
.seg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--stroke);border-radius:999px;padding:2px}
.seg button{padding:5px 13px;border-radius:999px;font-size:12.4px;color:var(--muted)}
.seg button.on{background:rgba(56,225,198,.18);color:var(--cyan);font-weight:700;box-shadow:inset 0 0 0 1px rgba(56,225,198,.3)}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.05);color:var(--muted);font-size:12.2px;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.chip.on{color:var(--cyan);border-color:rgba(56,225,198,.34);background:rgba(56,225,198,.12)}
.chip.on i{background:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,198,.16)}
.vsep{width:1px;height:20px;background:var(--stroke)}
.dock .txt{font-size:11.8px;color:var(--muted);padding:0 4px}

/* ---------- 右上：圆形按钮组（L2/L3 入口） ---------- */
.acts{right:20px;top:10px;display:flex;gap:8px;align-items:center}
.circ{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.circ:hover{color:var(--ink);background:rgba(255,255,255,.16)}
.circ.on{color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(56,225,198,.4)}
.tip{position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;right:0;top:46px;white-space:nowrap;
  background:var(--glass2);border:1px solid var(--stroke);border-radius:8px;padding:5px 9px;font-size:11.8px;color:var(--ink2)}

/* ---------- 右侧：玻璃抽屉（低频配置的落地处） ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,8,14,.42);opacity:0;pointer-events:none;transition:.2s;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:392px;max-width:92vw;z-index:9;
        background:linear-gradient(180deg,rgba(20,29,42,.9),rgba(14,21,32,.94));
        border-left:1px solid var(--stroke);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
        box-shadow:-24px 0 60px rgba(2,8,16,.55);transform:translateX(102%);transition:transform .22s ease;
        display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--stroke);flex:0 0 auto}
.dhead .t{font-weight:800;font-size:14px}
.dhead .x{margin-left:auto;color:var(--muted);font-size:15px}
.dtabs{display:flex;gap:6px;padding:10px 14px 0;flex:0 0 auto;flex-wrap:wrap}
.dtab{padding:6px 12px;border-radius:999px;font-size:12.2px;color:var(--muted);border:1px solid transparent}
.dtab:hover{background:rgba(255,255,255,.07)}
.dtab.on{background:rgba(56,225,198,.14);color:var(--cyan);border-color:rgba(56,225,198,.3);font-weight:700}
.dbody{flex:1 1 auto;overflow:auto;padding:14px}
.panel{display:none} .panel.on{display:block}
.grp{border:1px solid var(--stroke);border-radius:12px;background:rgba(255,255,255,.04);padding:11px;margin-bottom:10px}
.grp h4{margin:0 0 9px;font-size:11.5px;color:var(--faint);letter-spacing:.6px;font-weight:700}
.mini{font-size:11.7px;color:var(--muted);line-height:1.7}
.mini b{color:var(--ink2)}
.row{display:flex;align-items:center;gap:7px} .row+.row{margin-top:7px}
.btn{border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:9px;padding:7px 12px;
     font-size:12.4px;color:var(--ink2);flex:1;text-align:center}
.btn:hover{background:rgba(255,255,255,.13);color:var(--ink)}
.btn.pri{background:rgba(56,225,198,.18);border-color:rgba(56,225,198,.36);color:var(--cyan);font-weight:700}
.btn.warn{background:rgba(255,197,98,.14);border-color:rgba(255,197,98,.3);color:var(--amber);font-weight:700}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.6px;color:var(--ink2)}
.wl li:hover{background:rgba(255,255,255,.07)}
.wl li.on{background:rgba(56,225,198,.13);color:var(--ink);font-weight:700}
.wl .code{margin-left:auto;font-size:11.5px;color:var(--faint)}
.wl .chg{width:54px;text-align:right;font-size:11.5px}
.up{color:var(--up)} .down{color:var(--down)}
label.f{display:block;font-size:11.5px;color:var(--faint);margin:0 0 5px;letter-spacing:.4px}
select.g{width:100%;border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:9px;
  padding:8px 10px;font:inherit;color:var(--ink2);outline:none}

/* ---------- 十字光标 ---------- */
.xh{position:absolute;inset:0;pointer-events:none;z-index:4}
.xh .v{position:absolute;top:0;bottom:0;width:1px;background:rgba(160,180,200,.55)}
.xh .h{position:absolute;left:0;right:0;height:1px;background:rgba(160,180,200,.35)}
.xh .tagbox{position:absolute;padding:5px 10px;border-radius:9px;font-size:11.8px;color:var(--ink);
  background:var(--glass2);border:1px solid var(--stroke);backdrop-filter:var(--blur);white-space:nowrap}
.badge{position:fixed;left:20px;bottom:16px;background:rgba(8,13,22,.86);border:1px solid var(--stroke);
  color:var(--ink2);border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.65;z-index:20;max-width:430px}
.badge b{color:var(--cyan)} .badge .x{float:right;margin-left:10px;opacity:.6;cursor:pointer}
</style>
</head>
<body>

<!-- 图表铺满 -->
<div class="stage">
  <div class="chead">
    <span style="font-size:11.5px;color:#61707F;font-weight:700;letter-spacing:.5px">行情工作台</span>
    <span class="vsep" style="height:16px;background:rgba(255,255,255,.12)"></span>
    <div class="ctitle">西藏天路 <span class="num" style="color:#8B9BAD;font-size:13px;font-weight:600">600326</span></div>
    <div class="csub" id="csub">日线 · 前复权 · 共 140 根 · 截至 2026-09-16</div>
  </div>

  <div class="panes" id="panes">
    <div class="pane main" id="paneMain">
      <div class="plabel">主图 · K 线 + MA + 公式叠层</div>
      <svg id="main" viewBox="0 0 1200 340" preserveAspectRatio="none"></svg>
    </div>
    <div class="pane vol" id="paneVol"><div class="plabel">成交量</div>
      <svg id="vol" viewBox="0 0 1200 96" preserveAspectRatio="none"></svg></div>
    <div class="pane macd" id="paneMacd"><div class="plabel">MACD</div>
      <svg id="macd" viewBox="0 0 1200 110" preserveAspectRatio="none"></svg></div>
    <div class="xh" id="xh" style="display:none"><div class="v"></div><div class="h"></div><div class="tagbox"></div></div>
  </div>
  <div class="xaxis" id="xaxis"></div>
</div>

<!-- 左上：标的浮条 -->
<div class="hud glass topsym" id="hudTop">
  <input class="q" value="600326" placeholder="代码 / 名称">
  <button class="rbtn">查阅</button>
  <button class="rbtn" id="btnSync">☁️ 同步</button>
  <span class="live"><i></i><span id="syncTxt">本地命中 · 未联网</span></span>
</div>

<!-- 左侧：画线工具条 -->
<div class="hud glass toolrail" id="hudTools">
  <button title="浏览" class="on">✥</button>
  <button title="趋势线">╱</button>
  <button title="水平线">─</button>
  <button title="垂直线">│</button>
  <button title="斐波那契">≡</button>
  <button title="文字">T</button>
  <div class="div"></div>
  <button title="删除选中">🧽</button>
  <button title="清空本标的标注">🗑️</button>
</div>

<!-- 底部中央：周期 / 叠加 -->
<div class="hud glass dock" id="hudDock">
  <span class="txt">周期</span>
  <div class="seg" id="segPeriod">
    <button data-p="D" class="on">日</button><button data-p="W">周</button><button data-p="M">月</button>
  </div>
  <span class="vsep"></span>
  <button class="chip on" data-ov="ma"><i></i>MA</button>
  <button class="chip" data-ov="boll"><i></i>BOLL</button>
  <button class="chip on" data-ov="formula"><i></i>公式 2 段</button>
  <span class="vsep"></span>
  <button class="chip on" data-ov="vol"><i></i>量</button>
  <button class="chip on" data-ov="macd"><i></i>MACD</button>
  <span class="vsep"></span>
  <span class="txt" id="annoTxt">标注 3 条</span>
</div>

<!-- 右上：圆形按钮组 -->
<div class="hud acts" id="hudActs">
  <div class="glass tip" data-tip="钉住/取消钉住界面"><button class="circ" id="btnPin" title="钉住界面">📌</button></div>
  <div class="glass tip" data-tip="自选股"><button class="circ" id="btnWatch">★</button></div>
  <div class="glass tip" data-tip="公式与配方"><button class="circ" id="btnFormula">ƒ</button></div>
  <div class="glass tip" data-tip="主图叠加 / 附图"><button class="circ" id="btnLayer">◫</button></div>
  <div class="glass tip" data-tip="数据与同步"><button class="circ" id="btnData">⛁</button></div>
</div>

<!-- 右侧玻璃抽屉 -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><span class="t" id="dTitle">自选股</span>
    <span class="mini" style="margin-left:6px">低频配置都在这里，不占图表</span>
    <span class="x" id="dClose">✕</span></div>
  <div class="dtabs" id="dTabs"></div>
  <div class="dbody" id="dBody"></div>
</aside>

<div class="badge" id="badge">
  <span class="x" onclick="document.getElementById('badge').style.display='none'">✕</span>
  <b>C · 沉浸全屏 + 悬浮玻璃（Immersive HUD）</b> —— 图表占满 100% 高度，控制项浮在图上、静置 3 秒自动淡出。<br>
  交互：鼠标不动一会儿浮层会淡出 · 点 📌 钉住 · 右上圆钮打开右侧玻璃抽屉 · 底部胶囊切周期/叠加 · 图上移动看跨窗格读数。<br>
  <span style="opacity:.6">示意数据（固定种子，非真实行情）</span>
</div>

<script>
/* ---------- 示意数据 ---------- */
function makeData(n, seed, start){
  let s = seed, r = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  let p = start, out = [];
  for (let i = 0; i < n; i++){
    const d = Math.sin(i / 11) * 0.10 + Math.sin(i / 37) * 0.07 + (r() - 0.5) * 0.20;
    const o = p, c = Math.max(4, o + d);
    out.push({o, c, h: Math.max(o, c) + r() * 0.12, l: Math.min(o, c) - r() * 0.12, v: 120 + r() * 260});
    p = c;
  }
  return out;
}
function tradingDates(n){ const out = [], d = new Date(2024, 0, 2);
  while (out.length < n){ const w = d.getDay(); if (w !== 0 && w !== 6) out.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return out; }
const DATES = tradingDates(400), RAW = makeData(200, 20260916, 16.8);
function agg(bars, k){ const out = [], dts = [];
  for (let i = 0; i < bars.length; i += k){ const g = bars.slice(i, i + k); if (!g.length) break;
    out.push({o:g[0].o, c:g[g.length - 1].c, h:Math.max.apply(null, g.map(x => x.h)),
              l:Math.min.apply(null, g.map(x => x.l)), v:g.reduce((a, b) => a + b.v, 0)});
    dts.push(i + g.length - 1); }
  return {bars: out, dateIdx: dts}; }
function ma(a, n){ return a.map((_, i) => i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((x, y) => x + y, 0) / n); }
function ema(a, n){ const k = 2 / (n + 1), o = []; a.forEach((v, i) => o.push(i ? v * k + o[i - 1] * (1 - k) : v)); return o; }

const TH = {up:'#FF5D6C', down:'#3ED598', ma5:'#FFC562', ma20:'#63B3FF', ma60:'#C08CFF',
  boll:'rgba(140,150,255,.5)', grid:'rgba(255,255,255,.055)', formula:'#38E1C6', dif:'#63B3FF', dea:'#FFC562'};
const W = 1200, PADX = 6;
const state = {period:'D', ov:{ma:true, boll:false, formula:true, vol:true, macd:true}};
/* 抽屉是动态重建的 ⇒ 每次打开后把 chip 的 class 与状态对齐（避免"两个真相"） */
function applyChips(){
  document.querySelectorAll('[data-ov]').forEach(el => {
    const k = el.dataset.ov;
    if (k in state.ov) el.classList.toggle('on', !!state.ov[k]);
  });
}
const S = {};
function mk(t, a){ const e = document.createElementNS('http://www.w3.org/2000/svg', t);
  for (const k in a) e.setAttribute(k, a[k]); return e; }
function svgEl(id){ const e = document.getElementById(id); e.innerHTML = ''; return e; }
function dateLabel(i){ const d = DATES[Math.min(i, DATES.length - 1)];
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const PN = {D:'日线', W:'周线', M:'月线'};

function render(){
  const view = state.period === 'D' ? {bars: RAW, dateIdx: RAW.map((_, i) => i)} : agg(RAW, state.period === 'W' ? 5 : 22);
  const bars = view.bars, n = bars.length, step = (W - PADX * 2) / n, X = i => PADX + i * step + step / 2;
  S.n = n; S.X = X; S.bars = bars; S.dateIdx = view.dateIdx;
  const closes = bars.map(b => b.c), m5 = ma(closes, 5), m20 = ma(closes, 20), m60 = ma(closes, 60);

  const H = 340, main = svgEl('main');
  let lo = Math.min.apply(null, bars.map(b => b.l)), hi = Math.max.apply(null, bars.map(b => b.h));
  const sd = m20.map((v, i) => { if (v == null) return null;
    const seg = closes.slice(Math.max(0, i - 19), i + 1);
    return Math.sqrt(seg.reduce((a, b) => a + (b - v) * (b - v), 0) / seg.length); });
  if (state.ov.boll) m20.forEach((v, i) => { if (v == null) return;
    hi = Math.max(hi, v + 2 * sd[i]); lo = Math.min(lo, v - 2 * sd[i]); });
  const padP = (hi - lo) * 0.07; lo -= padP; hi += padP;
  const Y = v => H - (v - lo) / (hi - lo) * H;
  S.lo = lo; S.hi = hi;
  for (let g = 0; g <= 4; g++) main.appendChild(mk('line', {x1:0, y1:H * g / 4, x2:W, y2:H * g / 4, stroke:TH.grid, 'stroke-width':1}));
  bars.forEach((b, i) => {
    const x = X(i), up = b.c >= b.o, col = up ? TH.up : TH.down, bw = Math.max(1.2, step * 0.6);
    main.appendChild(mk('line', {x1:x, y1:Y(b.h), x2:x, y2:Y(b.l), stroke:col, 'stroke-width':Math.min(1.5, step * 0.13)}));
    const y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c));
    main.appendChild(mk('rect', {x:x - bw / 2, y:y1, width:bw, height:Math.max(1, y2 - y1), fill:col, opacity:.95}));
  });
  const line = (arr, c, wd) => { let d = '', open = false;
    arr.forEach((v, i) => { if (v == null){ open = false; return; } d += (open ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; open = true; });
    main.appendChild(mk('path', {d, fill:'none', stroke:c, 'stroke-width':wd || 1.5, 'stroke-linejoin':'round'})); };
  if (state.ov.boll){ line(m20.map((v, i) => v == null ? null : v + 2 * sd[i]), TH.boll, 1);
    line(m20, TH.boll, 1); line(m20.map((v, i) => v == null ? null : v - 2 * sd[i]), TH.boll, 1); }
  if (state.ov.ma){ line(m5, TH.ma5); line(m20, TH.ma20); line(m60, TH.ma60, 1.1); }
  if (state.ov.formula){
    line(closes.map((v, i) => i < 30 ? null : m5[i] * 0.996 + 0.22), TH.formula, 1.9);
    bars.forEach((b, i) => { if (i % 13 < 4) main.appendChild(mk('rect',
      {x:X(i) - step * 0.34, y:Y(lo + (hi - lo) * 0.055), width:step * 0.68, height:3, fill:TH.formula, opacity:.9})); });
  }

  const HV = 96, vol = svgEl('vol');
  const vhi = Math.max.apply(null, bars.map(b => b.v)) * 1.08;
  for (let g = 0; g <= 2; g++) vol.appendChild(mk('line', {x1:0, y1:HV * g / 2, x2:W, y2:HV * g / 2, stroke:TH.grid, 'stroke-width':1}));
  bars.forEach((b, i) => { const h = b.v / vhi * HV;
    vol.appendChild(mk('rect', {x:X(i) - step * 0.3, y:HV - h, width:Math.max(1, step * 0.6), height:h,
      fill: b.c >= b.o ? TH.up : TH.down, opacity:.42})); });

  const HM = 110, macd = svgEl('macd');
  const dif = ema(closes, 12).map((v, i) => v - ema(closes, 26)[i]);
  const dea = ema(dif, 9), hist = dif.map((v, i) => v - dea[i]);
  const amp = Math.max.apply(null, hist.map(Math.abs).concat(dif.map(Math.abs))) * 1.15;
  const MY = v => HM / 2 - v / amp * (HM / 2 - 6);
  macd.appendChild(mk('line', {x1:0, y1:MY(0), x2:W, y2:MY(0), stroke:TH.grid, 'stroke-width':1}));
  hist.forEach((v, i) => { const y = MY(v), z = MY(0);
    macd.appendChild(mk('rect', {x:X(i) - step * 0.3, y:Math.min(y, z), width:Math.max(1, step * 0.6),
      height:Math.max(1, Math.abs(z - y)), fill: v >= 0 ? 'rgba(255,93,108,.55)' : 'rgba(62,213,152,.5)'})); });
  const mline = (a, c) => { let d = ''; a.forEach((v, i) => d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + MY(v).toFixed(1) + ' ');
    macd.appendChild(mk('path', {d, fill:'none', stroke:c, 'stroke-width':1.5})); };
  mline(dif, TH.dif); mline(dea, TH.dea);
  document.getElementById('paneVol').style.display = state.ov.vol ? '' : 'none';
  document.getElementById('paneMacd').style.display = state.ov.macd ? '' : 'none';

  const lab = document.getElementById('xaxis'); lab.innerHTML = '';
  for (let k = 0; k <= 6; k++){ const i = Math.round((n - 1) * k / 6);
    const sp = document.createElement('span'); sp.textContent = dateLabel(view.dateIdx[i]); lab.appendChild(sp); }
  document.getElementById('csub').textContent = PN[state.period] + ' · 前复权 · 共 ' + n + ' 根 · 截至 ' + dateLabel(n - 1);
}

let idleTimer = null;
function wake(){
  document.body.classList.remove('idle');
  if (idleTimer) clearTimeout(idleTimer);
  if (!document.body.classList.contains('pinned'))
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}
document.addEventListener('mousemove', wake);
document.addEventListener('keydown', wake);
wake();
document.getElementById('btnPin').addEventListener('click', e => {
  const pinned = document.body.classList.toggle('pinned');
  e.currentTarget.classList.toggle('on', pinned);
  e.currentTarget.textContent = pinned ? '📍' : '📌';
  wake();
});

const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim'), dBody = document.getElementById('dBody');
function openDrawer(key, tabIdx){
  const cfg = DRAWERS[key]; if (!cfg) return;
  document.getElementById('dTitle').textContent = cfg.title;
  document.getElementById('dTabs').innerHTML = cfg.tabs.map((t, i) =>
    `<button class="dtab${i === (tabIdx || 0) ? ' on' : ''}" data-i="${i}">${t}</button>`).join('');
  dBody.innerHTML = cfg.html.map((h, i) => `<div class="panel${i === (tabIdx || 0) ? ' on' : ''}">${h}</div>`).join('');
  drawer.classList.add('on'); scrim.classList.add('on');
  document.getElementById('dTabs').querySelectorAll('.dtab').forEach(b => b.addEventListener('click', () => {
    document.getElementById('dTabs').querySelectorAll('.dtab').forEach(x => x.classList.remove('on')); b.classList.add('on');
    dBody.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('on', i === +b.dataset.i));
  }));
  dBody.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {

    document.querySelectorAll('.chip[data-ov="' + k + '"]').forEach(x => x.classList.toggle('on', state.ov[k]));

  }));
  applyChips();

/* ---------- 跨窗格十字光标 ---------- */
const wrap = document.getElementById('panes'), xh = document.getElementById('xh');
const vline = xh.querySelector('.v'), hline = xh.querySelector('.h'), tagbox = xh.querySelector('.tagbox');
wrap.addEventListener('mousemove', ev => {
  if (!S.n) return;
  const pr0 = wrap.getBoundingClientRect(), r = pr0;      // xh 的坐标原点 = .panes（它自己）
  const mr = document.getElementById('paneMain').getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (ev.clientX - mr.left) / mr.width));
  const i = Math.min(S.n - 1, Math.max(0, Math.round(frac * S.n - 0.5)));
  xh.style.display = '';
  const vx = mr.left - pr0.left + S.X(i) / W * mr.width;
  vline.style.left = vx + 'px';
  const hit = ['paneMain','paneVol','paneMacd'].map(id => document.getElementById(id))
    .find(el => { const q = el.getBoundingClientRect(); return ev.clientY >= q.top && ev.clientY <= q.bottom; });
  if (hit){ const q = hit.getBoundingClientRect(); hline.style.display = ''; hline.style.top = (q.top - r.top) + 'px'; }
  const b = S.bars[i];
  tagbox.textContent = dateLabel(S.dateIdx[i]) + '　O ' + b.o.toFixed(2) + ' H ' + b.h.toFixed(2)
    + ' L ' + b.l.toFixed(2) + ' C ' + b.c.toFixed(2) + '　量 ' + Math.round(b.v) + ' 万手';
  tagbox.style.left = Math.max(6, vx + 12) + 'px'; tagbox.style.top = '6px';
});
wrap.addEventListener('mouseleave', () => { xh.style.display = 'none'; });
